<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srcset y Sizes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="../../imagenes-y-videos/luffy-small.jpg" 
    srcset="
    ../../imagenes-y-videos/luffy-small.jpg 360w,
    ../../imagenes-y-videos/luffy-medium.jpg 600w,
    ../../imagenes-y-videos/luffy-normal.jpg 1000w"
    sizes="(max-width: 400px) 300px, 
    (max-width: 600px) 500px, 900px"
    >
    <!-- 
    Las Media Query, son algo parecido a condicionales, si estas se cumplen, se aplica las caracteristicas asignadas
    sizes="
    (max-width: 400px) 300px, 
    (max-width: 600px) 500px, 900px
    "
    Si las pantallas tienen una resolucion 400px o menos se cargan imagenes de hasta 360px o menos
    Si las pantallas tienen una resolucion de menos de 600px y mas de 500px, se cargan imagenes de 600px o menos
    Si la resolución de la pantallas es de mas de 500px se cargan imagenes de 900px o mas
    -->
</body>
</html>
